{% extends "base.html" %}
{% block title %}500 — ошибка сервера{% endblock %}
{% block content %}
<section class="card error-card">
  <p class="error-code">500</p>
  <h1>Что-то пошло не так</h1>
  <p class="muted">
    Внутренняя ошибка сервера. Технические подробности записаны в журнал, но не показываются
    пользователю. Попробуйте повторить действие позже.
  </p>
  <a class="button button-primary" href="{{ url_for('index') }}">На главную</a>
</section>
{% endblock %}
