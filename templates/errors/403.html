{% extends "base.html" %}
{% block title %}403 — нет доступа{% endblock %}
{% block content %}
<section class="card error-card">
  <p class="error-code">403</p>
  <h1>Нет доступа</h1>
  <p class="muted">{{ message or 'У вашей роли нет прав на эту страницу.' }}</p>
  <a class="button button-primary" href="{{ url_for('index') }}">На главную</a>
</section>
{% endblock %}
